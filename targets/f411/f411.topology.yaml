# targets/f411/f411.topology.yaml
# STM32F411 "Blackpill" ADC->DMA->SRAM demo scenario.
blocks:
  - id: pa1
    kind: pin
    title: PA1
  - id: adc1
    kind: peripheral
    title: ADC1
    svd: ADC1
    ports: {DR: [r, 0.5]}
  - id: mux0
    kind: mux
    title: MUX
    select: "DMA2.S0CR.CHSEL"
  - id: tim1
    kind: peripheral
    title: TIM1
    svd: TIM1
  - id: dma2
    kind: dma
    title: DMA2
    svd: DMA2
    ports: {periph: [l, 0.5], mem: [r, 0.5]}
  - id: busmx
    kind: interconnect
    title: AHB Bus Matrix
  - id: sram1
    kind: memory
    title: SRAM1 128KB
    base: 0x20000000
    size: 0x20000
  - id: cm4
    kind: cpu
    title: Cortex-M4
  - id: flash
    kind: memory
    title: Flash 512KB
    base: 0x08000000
    size: 0x80000
edges:
  - {from: pa1, to: adc1, label: AIN1}
  - {from: adc1, to: mux0, label: DR, when_select: 0,
     points: [[210, 320], [232, 320], [232, 350], [255, 350]]}
  - {from: tim1, to: mux0, label: TRGO, when_select: 6,
     points: [[200, 470], [232, 470], [232, 400], [255, 400]]}
  - {from: mux0, to: dma2, to_port: periph, label: S0}
  - {from: dma2, from_port: mem, to: busmx, label: AHB,
     points: [[490, 370], [580, 370]]}
  - {from: busmx, to: sram1, label: M0AR,
     points: [[690, 275], [780, 275]]}
  - {from: flash, to: busmx, label: I-bus,
     points: [[780, 90], [690, 90]]}
  - {from: busmx, to: cm4, label: fetch,
     points: [[580, 95], [230, 95]]}

layout:
  pa1:   {x: 8,   y: 300, w: 34,  h: 34}
  adc1:  {x: 70,  y: 280, w: 140, h: 80}
  tim1:  {x: 70,  y: 430, w: 130, h: 80}
  mux0:  {x: 255, y: 330, w: 45,  h: 90}
  dma2:  {x: 330, y: 320, w: 160, h: 100}
  busmx: {x: 580, y: 40,  w: 110, h: 440}
  sram1: {x: 780, y: 230, w: 170, h: 90}
  cm4:   {x: 70,  y: 50,  w: 160, h: 90}
  flash: {x: 780, y: 50,  w: 170, h: 80}

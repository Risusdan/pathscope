[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pathscope"
version = "0.2.0"
description = "Live data-path observer for MCU/SoC bring-up and debugging"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pyocd>=0.36",
    "PyYAML>=6.0",
]
license = {file = "LICENSE"}
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Embedded Systems",
    "Topic :: Software Development :: Debuggers",
]

[project.urls]
Homepage = "https://github.com/Risusdan/pathscope"
Issues = "https://github.com/Risusdan/pathscope/issues"

[project.optional-dependencies]
ui = ["PySide6>=6.5", "pyqtgraph>=0.13", "pyelftools>=0.29"]
dev = ["pytest>=7.0", "pytest-qt>=4.2"]
build = ["pyinstaller>=6.0"]

[project.scripts]
pathscope = "cli:main"

[tool.setuptools]
packages = [
    "core", "core.adapter", "core.engine", "core.target", "core.trace",
    "ui", "ui.diagram", "ui.panels",
]
py-modules = ["cli"]

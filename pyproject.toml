[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pathscope"
version = "0.1.0"
description = "Live data-path observer for MCU/SoC bring-up and debugging"
requires-python = ">=3.9"
dependencies = [
    "pyocd>=0.36",
    "PyYAML>=6.0",
]
license = {file = "LICENSE"}

[project.optional-dependencies]
ui = ["PySide6>=6.5", "pyqtgraph>=0.13"]
dev = ["pytest>=7.0", "pytest-qt>=4.2"]
build = ["pyinstaller>=6.0"]

[project.scripts]
pathscope = "cli:main"

[tool.setuptools]
packages = [
    "core", "core.adapter", "core.engine", "core.target",
    "ui", "ui.diagram", "ui.panels",
]
py-modules = ["cli"]

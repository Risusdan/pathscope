name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.9", "3.12"]
    env:
      # Run the Qt-backed test suite without a display. Hardware tests
      # are already deselected by default via pytest.ini's addopts.
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Qt platform libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 \
            libxkbcommon-x11-0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0
        # Even the offscreen QPA platform plugin dynamically links
        # against EGL and the xkb/xcb libraries below, so Qt fails to
        # load on a bare Ubuntu runner without them installed.

      - name: Install package (ui + dev extras)
        run: python -m pip install -e ".[ui,dev]"

      - name: Run test suite
        run: pytest -q
